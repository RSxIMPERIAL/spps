<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPPS — Study Plan Preparation System</title>
  <meta name="description"
    content="Discover Indian competitive examinations, build personalized timetables, practice official previous-year questions, and prepare consistently with SPPS.">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'><rect width='24' height='24' rx='6'/><text x='12' y='17' font-size='14' font-weight='bold' fill='white' text-anchor='middle'>S</text></svg>">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    /* Responsive navbar & drawer helper styles */
    @media (max-width: 900px) {
      .hidden-on-mobile {
        display: none !important;
      }

      #mobile-menu-btn {
        display: inline-flex !important;
      }

      .sidebar-wrapper {
        position: fixed !important;
        left: -280px;
        top: 0 !important;
        height: 100vh !important;
        width: 270px !important;
        z-index: 100 !important;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.25);
        transition: left 0.25s ease-in-out;
      }

      .sidebar-wrapper.sidebar-mobile-open {
        left: 0 !important;
      }
    }
  </style>
</head>

<body>
  <div class="app-container">
    <!-- Main Content Column -->
    <div class="main-content">
      <!-- Top Application Header -->
      <header id="app-navbar"
        style="background: #ffffff; border-bottom: 1px solid var(--border-subtle); position: sticky; top: 0; z-index: 50;">
      </header>

      <div style="display: flex; flex: 1;">
        <!-- Collapsible Desktop/Mobile Sidebar -->
        <div id="app-sidebar"></div>

        <!-- Dynamic Page View Container -->
        <main class="page-body" id="view-container">
          <div style="text-align: center; padding: 4rem; color: #64748b;">
            Loading SPPS...
          </div>
        </main>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- Scripts in dependency order -->
  <script src="/js/icons.js"></script>
  <script src="/js/charts.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/state.js"></script>
  <script src="/js/components/modal.js"></script>
  <script src="/js/components/navbar.js"></script>
  <script src="/js/components/sidebar.js"></script>

  <!-- Views -->
  <script src="/js/views/landing.js"></script>
  <script src="/js/views/authModal.js"></script>
  <script src="/js/views/dashboard.js"></script>
  <script src="/js/views/exploreExams.js"></script>
  <script src="/js/views/examDetails.js"></script>
  <script src="/js/views/myPrep.js"></script>
  <script src="/js/views/studyPlanner.js"></script>
  <script src="/js/views/timetable.js"></script>
  <script src="/js/views/pyq.js"></script>
  <script src="/js/views/dailyPractice.js"></script>
  <script src="/js/views/streaksProgress.js"></script>
  <script src="/js/views/profileSettings.js"></script>
  <script src="/js/views/adminImport.js"></script>
  <script src="/js/views/adminConsole.js"></script>

  <!-- Core App Controller -->
  <script src="/js/app.js"></script>
</body>

</html>
